[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-slowest-first"
version = "0.2.0"
description = "Sort tests by their last duration, slowest first"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexey Klimkin", email = "klimkin@gmail.com" }]
maintainers = [{ name = "Alexey Klimkin", email = "klimkin@gmail.com" }]
dependencies = ["pytest>=7.0.0,<9.2", "pytest-xdist>=3.1.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/klimkin/pytest-slowest-first"

[project.entry-points.pytest11]
slowest-first = "pytest_slowest_first"

[dependency-groups]
dev = [
    "flake8>=7",
    "ruff>=0.17.3",
]

[tool.setuptools]
py-modules = ["pytest_slowest_first"]
