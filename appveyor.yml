image: Visual Studio 2022

environment:
  UV_VERSION: "0.13.5"
  UV_INSTALL_DIR: C:\uv
  matrix:
    - UV_PYTHON: "3.10"
    - UV_PYTHON: "3.11"
    - UV_PYTHON: "3.12"
    - UV_PYTHON: "3.13"
    - UV_PYTHON: "3.14"

install:
  - ps: irm "https://astral.sh/uv/$env:UV_VERSION/install.ps1" | iex
  - C:\uv\uv.exe sync --locked

build: false

test_script:
  - C:\uv\uv.exe run --locked pytest tests
  - C:\uv\uv.exe run --locked flake8 --max-line-length 100 pytest_slowest_first.py tests

after_test:
  - C:\uv\uv.exe build

artifacts:
  - path: dist\*
